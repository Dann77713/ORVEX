<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORVEX — El Mundo en Tiempo Real</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Courier New',monospace;background:#050a0f;color:#e0f0ff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(5,10,20,0.97);border-bottom:1px solid rgba(0,180,255,0.2);z-index:1000;flex-shrink:0}
  #logo{font-size:20px;font-weight:700;letter-spacing:4px;color:#00cfff}
  #logo span{color:#fff;font-size:10px;font-weight:400;display:block;letter-spacing:2px;opacity:0.6}
  #live-badge{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:2px;color:#ff4444}
  #live-dot{width:8px;height:8px;background:#ff4444;border-radius:50%;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(1.3)}}
  #activity{font-size:11px;color:#00cfff;letter-spacing:1px;text-align:right}
  #activity b{font-size:16px;color:#fff;display:block}
  #categories{display:flex;gap:6px;padding:8px 16px;background:rgba(5,10,20,0.9);border-bottom:1px solid rgba(0,180,255,0.1);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
  #categories::-webkit-scrollbar{display:none}
  .cat-btn{padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);font-size:10px;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:all 0.2s;font-family:inherit}
  .cat-btn.active{background:rgba(0,207,255,0.15);border-color:#00cfff;color:#00cfff}
  .cat-btn:hover{border-color:rgba(0,207,255,0.5);color:rgba(0,207,255,0.8)}
  #main{display:flex;flex:1;overflow:hidden}
  #map{flex:1;position:relative;z-index:1}
  .leaflet-tile-pane{filter:brightness(0.4) saturate(0.3) hue-rotate(180deg)}
  .leaflet-container{background:#050a0f}
  #sidebar{width:290px;background:rgba(5,10,20,0.97);border-left:1px solid rgba(0,180,255,0.15);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  #sidebar-header{padding:10px 14px;border-bottom:1px solid rgba(0,180,255,0.1);font-size:10px;letter-spacing:2px;color:rgba(0,207,255,0.7);display:flex;align-items:center;gap:6px}
  #sidebar-header::before{content:'';width:6px;height:6px;background:#ff4444;border-radius:50%;animation:pulse 1.2s infinite}
  #news-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(0,180,255,0.3) transparent}
  .news-item{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:background 0.2s}
  .news-item:hover{background:rgba(0,207,255,0.05)}
  .news-item.active{background:rgba(0,207,255,0.08);border-left:2px solid #00cfff}
  .news-time{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-bottom:4px}
  .news-title{font-size:12px;color:#e0f0ff;line-height:1.4;margin-bottom:6px}
  .news-source{font-size:10px;color:rgba(0,207,255,0.6)}
  .news-img{width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:6px;opacity:0.8}
  #markets{display:flex;gap:0;border-top:1px solid rgba(0,180,255,0.15);flex-shrink:0}
  .market-item{flex:1;padding:8px 6px;border-right:1px solid rgba(0,180,255,0.1);text-align:center}
  .market-item:last-child{border-right:none}
  .market-name{font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px}
  .market-price{font-size:12px;font-weight:700;color:#fff;margin:2px 0}
  .market-change{font-size:9px}
  .up{color:#00ff88}.down{color:#ff4444}
  .custom-marker{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.8);cursor:pointer;animation:markerPulse 2s infinite}
  @keyframes markerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0.3)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
  .leaflet-popup-content-wrapper{background:rgba(5,15,30,0.97);border:1px solid rgba(0,207,255,0.3);border-radius:6px;color:#e0f0ff;font-family:'Courier New',monospace;box-shadow:0 4px 20px rgba(0,0,0,0.8)}
  .leaflet-popup-tip{background:rgba(5,15,30,0.97)}
  .leaflet-popup-content{margin:10px 14px;font-size:12px;line-height:1.5}
  .popup-title{font-weight:700;font-size:13px;margin-bottom:4px}
  .popup-meta{font-size:10px;color:rgba(0,207,255,0.7);margin-bottom:6px}
  .popup-link{font-size:10px;color:#00cfff;text-decoration:none}
  .leaflet-control-zoom a{background:rgba(5,15,30,0.9)!important;border-color:rgba(0,207,255,0.3)!important;color:#00cfff!important}
  #loading-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,10,20,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
  #loading-text{font-size:13px;color:#00cfff;letter-spacing:2px;animation:pulse 1.5s infinite}
  .spinner{width:40px;height:40px;border:2px solid rgba(0,207,255,0.2);border-top-color:#00cfff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="header">
  <div id="logo">ORVEX<span>SEE THE WORLD FIRST</span></div>
  <div id="live-badge"><div id="live-dot"></div>EN VIVO</div>
  <div id="activity">ACTIVIDAD GLOBAL<b id="act-count">—</b></div>
</div>

<div id="categories">
  <button class="cat-btn active" data-cat="general">TODOS</button>
  <button class="cat-btn" data-cat="business">ECONOMIA</button>
  <button class="cat-btn" data-cat="technology">TECNOLOGIA</button>
  <button class="cat-btn" data-cat="health">SALUD</button>
  <button class="cat-btn" data-cat="science">CIENCIA</button>
  <button class="cat-btn" data-cat="sports">DEPORTES</button>
  <button class="cat-btn" data-cat="entertainment">ENTRETENIMIENTO</button>
</div>

<div id="main">
  <div id="map">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="loading-text">CONECTANDO FUENTES GLOBALES...</div>
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-header">EN DIRECTO</div>
    <div id="news-list"><div style="padding:20px;font-size:12px;color:rgba(255,255,255,0.3);text-align:center">Cargando noticias reales...</div></div>
    <div id="markets">
      <div class="market-item"><div class="market-name">BTC</div><div class="market-price" id="m-btc">—</div><div class="market-change" id="m-btc-c">—</div></div>
      <div class="market-item"><div class="market-name">ORO</div><div class="market-price" id="m-gold">—</div><div class="market-change" id="m-gold-c">—</div></div>
      <div class="market-item"><div class="market-name">S&P500</div><div class="market-price" id="m-sp">—</div><div class="market-change" id="m-sp-c">—</div></div>
    </div>
  </div>
</div>

<script>
const API_KEY = '9f11901189b748799c09bb7d952e9326';

const countryCoords = {
  'us':{'name':'Estados Unidos','lat':37.09,'lng':-95.71},
  'gb':{'name':'Reino Unido','lat':55.37,'lng':-3.43},
  'de':{'name':'Alemania','lat':51.16,'lng':10.45},
  'fr':{'name':'Francia','lat':46.22,'lng':2.21},
  'jp':{'name':'Japon','lat':36.20,'lng':138.25},
  'cn':{'name':'China','lat':35.86,'lng':104.19},
  'in':{'name':'India','lat':20.59,'lng':78.96},
  'br':{'name':'Brasil','lat':-14.23,'lng':-51.92},
  'ru':{'name':'Rusia','lat':61.52,'lng':105.31},
  'au':{'name':'Australia','lat':-25.27,'lng':133.77},
  'ca':{'name':'Canada','lat':56.13,'lng':-106.34},
  'mx':{'name':'Mexico','lat':23.63,'lng':-102.55},
  'es':{'name':'Espana','lat':40.46,'lng':-3.74},
  'it':{'name':'Italia','lat':41.87,'lng':12.56},
  'za':{'name':'Sudafrica','lat':-30.55,'lng':22.93},
  'ae':{'name':'Emiratos','lat':23.42,'lng':53.84},
  'kr':{'name':'Corea del Sur','lat':35.90,'lng':127.76},
  'ar':{'name':'Argentina','lat':-38.41,'lng':-63.61},
  'ng':{'name':'Nigeria','lat':9.08,'lng':8.67},
  'eg':{'name':'Egipto','lat':26.82,'lng':30.80},
};

const catColorMap = {
  general:'#00cfff',business:'#00ff88',technology:'#aa44ff',
  health:'#ff44aa',science:'#ff8800',sports:'#ffdd00',entertainment:'#ff4444'
};

let map, markers=[], allArticles=[], activeFilter='general';

function initMap(){
  map = L.map('map',{zoomControl:true,attributionControl:false}).setView([20,10],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
}

function timeAgo(dateStr){
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 60) return 'Hace '+mins+' min';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return 'Hace '+hrs+'h';
  return 'Hace '+Math.floor(hrs/24)+'d';
}

function getCountryFromUrl(url){
  try{
    const host = new URL(url).hostname;
    for(const [code] of Object.entries(countryCoords)){
      if(host.includes('.'+code+'.') || host.endsWith('.'+code)) return code;
    }
  }catch(e){}
  return null;
}

function addJitter(lat,lng){
  return [lat+(Math.random()-0.5)*4, lng+(Math.random()-0.5)*4];
}

async function fetchNews(category){
  document.getElementById('loading-overlay').style.display='flex';
  document.getElementById('loading-text').textContent='CARGANDO: '+category.toUpperCase()+'...';
  try{
    const url='https://newsapi.org/v2/top-headlines?category='+category+'&pageSize=30&apiKey='+API_KEY;
    const res = await fetch(url);
    const data = await res.json();
    if(data.status !== 'ok') throw new Error(data.message);
    allArticles = (data.articles||[]).filter(a=>a.title && a.title!=='[Removed]');
    document.getElementById('act-count').textContent = (allArticles.length * 471).toLocaleString();
    renderNewsAndMarkers();
  }catch(e){
    document.getElementById('news-list').innerHTML='<div style="padding:20px;font-size:12px;color:#ff4444;text-align:center">Error: '+e.message+'</div>';
  }
  document.getElementById('loading-overlay').style.display='none';
}

function renderNewsAndMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  const list = document.getElementById('news-list');
  list.innerHTML='';
  const fallbackCountries = Object.values(countryCoords);
  const articlesWithCoords = allArticles.map((a,i)=>{
    const cc = getCountryFromUrl(a.url||'');
    const countryData = cc ? countryCoords[cc] : null;
    const coords = countryData
      ? addJitter(countryData.lat,countryData.lng)
      : addJitter(fallbackCountries[i%fallbackCountries.length].lat,fallbackCountries[i%fallbackCountries.length].lng);
    const countryName = countryData ? countryData.name : fallbackCountries[i%fallbackCountries.length].name;
    return {...a,lat:coords[0],lng:coords[1],countryName,idx:i};
  });

  articlesWithCoords.forEach((a,i)=>{
    const color = catColorMap[activeFilter]||'#00cfff';
    const el = document.createElement('div');
    el.className='custom-marker';
    el.style.background=color;
    el.style.borderColor=color+'cc';
    const m = L.marker([a.lat,a.lng],{
      icon:L.divIcon({className:'',html:el.outerHTML,iconSize:[14,14],iconAnchor:[7,7]})
    }).addTo(map);
    m.bindPopup(
      '<div class="popup-title">'+a.title.slice(0,80)+(a.title.length>80?'...':'')+'</div>'+
      '<div class="popup-meta">'+(a.source&&a.source.name?a.source.name:'—')+' · '+a.countryName+'</div>'+
      (a.url?'<a href="'+a.url+'" class="popup-link" target="_blank">Leer articulo</a>':'')
    );
    m.on('click',()=>highlightNews(i));
    markers.push(m);

    const item = document.createElement('div');
    item.className='news-item';
    item.id='news-'+i;
    item.onclick=()=>focusEvent(i,articlesWithCoords);
    item.innerHTML=
      (a.urlToImage?'<img class="news-img" src="'+a.urlToImage+'" onerror="this.style.display=\'none\'" alt=""/>':'')+
      '<div class="news-time">'+timeAgo(a.publishedAt)+' · '+a.countryName+'</div>'+
      '<div class="news-title">'+a.title.slice(0,100)+(a.title.length>100?'...':'')+'</div>'+
      '<div class="news-source">'+(a.source&&a.source.name?a.source.name:'Fuente desconocida')+'</div>';
    list.appendChild(item);
  });
}

function highlightNews(idx){
  document.querySelectorAll('.news-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('news-'+idx);
  if(el){el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function focusEvent(idx,articles){
  const a=articles[idx];
  if(!a)return;
  map.setView([a.lat,a.lng],5,{animate:true});
  markers[idx]&&markers[idx].openPopup();
  highlightNews(idx);
}

document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter=btn.dataset.cat;
    fetchNews(activeFilter);
  });
});

function animateMarkets(){
  const m=[
    {id:'m-btc',cid:'m-btc-c',base:63245,sym:'$'},
    {id:'m-gold',cid:'m-gold-c',base:2338,sym:'$'},
    {id:'m-sp',cid:'m-sp-c',base:5072,sym:'$'},
  ];
  m.forEach(mk=>{
    document.getElementById(mk.id).textContent=mk.sym+Math.round(mk.base).toLocaleString();
    document.getElementById(mk.cid).textContent='+0.00%';
    document.getElementById(mk.cid).className='market-change up';
  });
  setInterval(()=>{
    m.forEach(mk=>{
      const chg=(Math.random()-0.5)*0.4;
      mk.base*=(1+chg/100);
      const el=document.getElementById(mk.id);
      const cel=document.getElementById(mk.cid);
      if(el)el.textContent=mk.sym+Math.round(mk.base).toLocaleString();
      if(cel){cel.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';cel.className='market-change '+(chg>=0?'up':'down');}
    });
  },4000);
}

window.addEventListener('load',()=>{
  initMap();
  animateMarkets();
  fetchNews('general');
});
</script>
</body>
</html>
